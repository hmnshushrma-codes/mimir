<!doctype html>
<!-- Rendered at 1200x630 by scripts/capture-images.mjs, which fills the
     .shot img src with a data URI of a live workshop screenshot. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0f1117;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
        position: relative;
      }
      .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
      h1 { font-size: 92px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
      .tag { font-size: 30px; color: #a3a9b8; margin-top: 18px; }
      .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
      .chip { font-size: 17px; font-weight: 600; padding: 7px 16px; border-radius: 999px; }
      .sub { font-size: 20px; color: #6f7686; margin-top: 38px; }
      .url { font-size: 18px; color: #4e5566; margin-top: 6px; }
      .shot {
        position: absolute;
        right: 70px;
        top: 34px;
        width: 400px;
        height: 610px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #2a2f3a;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 8px rgba(59, 91, 253, 0.08);
        transform: rotate(-3deg);
        background: #e8e0d4;
      }
      .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #3b5bfd, #3d9a5a); }
    </style>
  </head>
  <body>
    <div class="text">
      <h1>Mimir</h1>
      <div class="tag">Watch your AI agents work</div>
      <div class="chips">
        <span class="chip" style="background:#16301f;color:#4ade80">Live Workshop</span>
        <span class="chip" style="background:#1c2350;color:#8197ff">Analytics</span>
        <span class="chip" style="background:#3a2a10;color:#f5b84a">Prompt Quality</span>
        <span class="chip" style="background:#2b1c3d;color:#b794f6">Cost Intel</span>
        <span class="chip" style="background:#3a1a1e;color:#f47c86">Permissions</span>
        <span class="chip" style="background:#16301f;color:#4ade80">Open Source</span>
      </div>
      <div class="sub">Real-time visualization for Claude Code sessions</div>
      <div class="url">mimir-demo.ninoforge.com</div>
    </div>
    <div class="shot"><img src="{{WORKSHOP}}" alt="" /></div>
    <div class="bar"></div>
  </body>
</html>
