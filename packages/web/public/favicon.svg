  <circle cx="32" cy="32" r="28" fill="#3a9a5c"/>
  <!-- Eyes - white sclera -->
  <ellipse cx="22" cy="28" rx="7" ry="7.5" fill="#fff"/>
  <ellipse cx="42" cy="28" rx="7" ry="7.5" fill="#fff"/>
  <!-- Pupils -->
  <circle cx="23" cy="28" r="4.5" fill="#1b1d23"/>
  <circle cx="43" cy="28" r="4.5" fill="#1b1d23"/>
