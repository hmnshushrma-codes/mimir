<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1117"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Accent glow behind mascot -->
  <ellipse cx="280" cy="340" rx="160" ry="160" fill="#3a9a5c" opacity="0.08"/>

  <!-- Mascot — large on the left -->
  <g transform="translate(180, 200)">
    <!-- Body -->
    <ellipse cx="100" cy="160" rx="70" ry="75" fill="#3a9a5c"/>
    <ellipse cx="100" cy="140" rx="35" ry="30" fill="#fff" opacity="0.1"/>
    <!-- Head -->
    <circle cx="100" cy="60" r="65" fill="#3a9a5c"/>
    <!-- Eyes -->
    <ellipse cx="75" cy="50" rx="15" ry="16" fill="#fff"/>
    <ellipse cx="125" cy="50" rx="15" ry="16" fill="#fff"/>
    <circle cx="78" cy="50" r="10" fill="#1b1d23"/>
    <circle cx="128" cy="50" r="10" fill="#1b1d23"/>
    <circle cx="82" cy="46" r="3" fill="#fff"/>
    <circle cx="132" cy="46" r="3" fill="#fff"/>
    <!-- Smile -->
    <path d="M72 78 Q100 96 128 78" stroke="#1b1d23" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Laptop -->
    <rect x="40" y="130" rx="4" width="120" height="60" fill="#1a1d24"/>
    <rect x="48" y="136" rx="2" width="104" height="44" fill="#111318"/>
    <!-- Code lines on screen -->
    <rect x="55" y="143" width="40" height="3" rx="1" fill="#3a9a5c" opacity="0.6"/>
    <rect x="60" y="150" width="30" height="3" rx="1" fill="#3a9a5c" opacity="0.4"/>
    <rect x="60" y="157" width="35" height="3" rx="1" fill="#3a9a5c" opacity="0.5"/>
    <rect x="55" y="164" width="25" height="3" rx="1" fill="#3a9a5c" opacity="0.35"/>
    <!-- Arms behind laptop -->
    <path d="M45,110 C30,115 25,140 35,170" stroke="#3a9a5c" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M155,110 C170,115 175,140 165,170" stroke="#3a9a5c" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Hands -->
    <circle cx="35" cy="170" r="10" fill="#3a9a5c"/>
    <circle cx="165" cy="170" r="10" fill="#3a9a5c"/>
  </g>

  <!-- Text — right side -->
  <text x="520" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">Mimir</text>
  <text x="520" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#8b92a5" letter-spacing="0.5">Watch your AI agents work</text>

  <!-- Feature pills -->
  <g transform="translate(520, 340)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#3a9a5c" opacity="0.15"/>
    <text x="65" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#3a9a5c" text-anchor="middle" font-weight="600">Live Workshop</text>

    <rect x="145" y="0" width="110" height="32" rx="16" fill="#3b5bfd" opacity="0.15"/>
    <text x="200" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#6b8aff" text-anchor="middle" font-weight="600">Analytics</text>

    <rect x="270" y="0" width="140" height="32" rx="16" fill="#c98a12" opacity="0.15"/>
    <text x="340" y="21" font-family="system-ui, sans-serif" font-size="13" fill="#e8a830" text-anchor="middle" font-weight="600">Prompt Quality</text>

    <rect x="0" y="44" width="120" height="32" rx="16" fill="#e34948" opacity="0.15"/>
    <text x="60" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#f06b6b" text-anchor="middle" font-weight="600">Permissions</text>

    <rect x="135" y="44" width="100" height="32" rx="16" fill="#8b5cf6" opacity="0.15"/>
    <text x="185" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="600">Cost Intel</text>

    <rect x="250" y="44" width="130" height="32" rx="16" fill="#1f9d55" opacity="0.15"/>
    <text x="315" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#4ade80" text-anchor="middle" font-weight="600">Open Source</text>
  </g>

  <!-- Subline -->
  <text x="520" y="480" font-family="system-ui, sans-serif" font-size="18" fill="#555b6e">Real-time visualization for Claude Code sessions</text>
  <text x="520" y="510" font-family="system-ui, sans-serif" font-size="16" fill="#444a5c">ninoforge.com</text>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="#3a9a5c" opacity="0.6"/>
</svg>
