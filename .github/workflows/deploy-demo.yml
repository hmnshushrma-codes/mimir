name: Deploy Demo to Cloudflare Pages

# Deploys the public demo (mimir-demo.ninoforge.com) only when main changes
# something the demo is built from, or when triggered by hand from the
# Actions tab. PRs are checked by ci.yml and never deploy.

on:
  push:
    branches: [main]
    paths:
      - "packages/web/**"
      - "packages/shared/**"
      - "scripts/build-demo.sh"
      - "scripts/deploy-demo.sh"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

# Never run two deploys at once; a newer push replaces a queued one
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        env:
          PNPM_IGNORE_BUILDS: "true"

      # Same script as local `pnpm demo:deploy` — secrets arrive as env vars
      # instead of .env.demo
      - run: bash scripts/deploy-demo.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_PROJECT_NAME: mimir-demo
          DEMO_BRANCH: main
