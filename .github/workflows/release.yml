name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install
      - run: bash scripts/prepare-publish.sh

      - name: Publish to npm
        run: cd publish && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    runs-on: ubuntu-latest
    needs: publish-npm
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            **npm (requires Node >= 22.5):**
            ```bash
            npx mimir-dev
            ```

            **Quick start:**
            ```bash
            npx mimir-dev install   # Wire up Claude Code hooks (one-time)
            npx mimir-dev           # Start the visualization
            ```

            **From source:**
            ```bash
            git clone https://github.com/hmnshushrma-codes/mimir.git
            cd mimir && pnpm install && pnpm build && pnpm start
            ```
